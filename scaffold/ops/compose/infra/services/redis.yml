# Redis (cache / streams; a password when REDIS_PASSWORD is set) -- a declared template (stack.infra.services: ["redis"]); values from ops/config/infra/.env.<env>.
services:
  redis:
    image: redis:7-alpine
    container_name: ${INFRA_PREFIX:-app}-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server --appendonly ${REDIS_AOF:-yes} $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [infra-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
