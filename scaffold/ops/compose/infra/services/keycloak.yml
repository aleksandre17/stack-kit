# Keycloak on the stack's Postgres (needs "postgres" too) -- a declared template (stack.infra.services: ["keycloak"]); values from ops/config/infra/.env.<env>.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: ${INFRA_PREFIX:-app}-keycloak
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${INFRA_PREFIX:-app}-postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in ops/config/infra}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in ops/config/infra}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?the public URL the edge serves it at}
      KC_HTTP_ENABLED: "true"           # TLS terminates at the edge
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in ops/config/infra}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in ops/config/infra}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    networks: [infra-net]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
