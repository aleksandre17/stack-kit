# Infra base — network + shared volumes. Service modules: services/*.yml
# Manifest: stack.infra.services selects which fragments stack-kit infra merges.

name: ${INFRA_COMPOSE_PROJECT:-app-infra}   # on a target the CLI's -p {project}-{env}-infra

networks:
  infra-net:
    # The environment's network is the ENVIRONMENT's, not this stack's: `infra up` makes it (remotely
    # {project}-{env}, locally {project}-net) and every compose that joins it -- this one and the
    # generated stack -- declares it external. A compose that declared it its own could not adopt a
    # network it had not labelled, and the stack would not start on a target that already had one.
    external: true
    name: ${STACK_KIT_NETWORK:?set STACK_KIT_NETWORK to the environment's network (infra up sets it)}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
